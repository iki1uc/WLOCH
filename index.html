<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GATE · SPRUNG-ACHSE</title>
<style>
body { background:#111; color:#eee; font-family:Arial; }
.section { padding:10px; border:1px solid #333; margin-bottom:20px; }
pre { background:#222; padding:10px; }
button { padding:10px; background:#6cf; border:none; cursor:pointer; }
button:hover { background:#9ef; }
</style>
</head>
<body>

<h1>GATE · SPRUNG-ACHSE</h1>

<div class="section">
  <h2>Sprung</h2>
  <pre id="jumpOut">Bereit…</pre>
</div>

<button onclick="startJump()">SPRUNG STARTEN</button>

<script type="module">
import { GATE } from "./GATE.js";

window.startJump = () => {
  const result = GATE.jump(3, 7);
  document.getElementById("jumpOut").innerText =
    JSON.stringify(result, null, 2);
};
</script>

</body>
</html>
