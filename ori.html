<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ODD-GATE-AXIS · AUTO SYSTEM</title>
<style>
body { background:#111; color:#eee; font-family:Arial; }
h1 { color:#6cf; }
.section { padding:10px; border:1px solid #333; margin-bottom:20px; }
pre { background:#222; padding:10px; }
button { padding:10px; background:#6cf; border:none; cursor:pointer; }
button:hover { background:#9ef; }
</style>
</head>
<body>

<h1>ODD-GATE-AXIS · AUTO · SHOW MUST BEGIN</h1>

<div class="section">
  <h2>ROOM DATA</h2>
  <pre id="roomOut">Noch keine Daten…</pre>
</div>

<div class="section">
  <h2>WLOCH Stabilisation</h2>
  <pre id="wlochOut">Bereit…</pre>
</div>

<div class="section">
  <h2>NC-LINK Routing</h2>
  <pre id="linkOut">Bereit…</pre>
</div>

<button onclick="startGate()">DATEN LADEN</button>

<script type="module">
import { loadAllRooms } from "./GateRoomLoader.js";
import { stabiliseRoom } from "./GATE_WLOCH.js";
import { syncRoom } from "./GATE_LINK.js";

window.startGate = async () => {

  // 1. Alle neuen room Dateien laden
  const rooms = await loadAllRooms();
  document.getElementById("roomOut").innerText =
    JSON.stringify(rooms, null, 2);

  // 2. WLOCH auf jeden Raum anwenden
  const wloch = {};
  for (const r in rooms) {
    wloch[r] = stabiliseRoom(rooms[r]);
  }
  document.getElementById("wlochOut").innerText =
    JSON.stringify(wloch, null, 2);

  // 3. NC-LINK auf jeden Raum anwenden
  const link = {};
  for (const r in rooms) {
    link[r] = syncRoom(rooms[r]);
  }
  document.getElementById("linkOut").innerText =
    JSON.stringify(link, null, 2);
};
</script>

</body>
</html>
